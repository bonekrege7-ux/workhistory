<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zhee Work Schedule</title>
    <!-- Inline Manifest PWA -->
    <script>
        const manifest = {
            "name": "Zhee Work Schedule",
            "short_name": "Zhee Schedule",
            "start_url": ".",
            "display": "standalone",
            "background_color": "#0F0E17",
            "theme_color": "#0F0E17",
            "icons": [{
                "src": "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='192' height='192' fill='%239D4EDD'><rect width='192' height='192' fill='%230F0E17'/><text x='50%' y='50%' dominant-baseline='middle' text-anchor='middle' font-size='80' font-family='sans-serif' fill='%23FFFFFF'>Z</text></svg>",
                "sizes": "192x192",
                "type": "image/svg+xml"
            }]
        };
        const manifestBlob = new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' });
        const manifestUrl = URL.createObjectURL(manifestBlob);
        const link = document.createElement('link');
        link.rel = 'manifest';
        link.href = manifestUrl;
        document.head.appendChild(link);
    </script>
    <style>
        /* ================= VARIABLES ================= */
        :root {
            --bg-main: #0B0A10;
            --bg-card: #1A1829;
            --border-card: #322B4A;
            --accent-main: #7B2CBF;
            --accent-dark: #241442;
            --accent-light: #9D4EDD;
            --text-main: #FFFFFF;
            --text-sec: #A0A0B2;
            --grad-btn: linear-gradient(135deg, #6C5CE7, #A29BFE);
        }

        /* ================= RESET & BASE ================= */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-main); line-height: 1.6; }
        
        /* ================= LAYOUT & UI ================= */
        header { padding: 20px; text-align: center; border-bottom: 1px solid var(--border-card); background: var(--bg-card); position: sticky; top: 0; z-index: 100; }
        header h1 { font-size: 1.5rem; background: var(--grad-btn); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        .nav-tabs { display: flex; justify-content: center; background: var(--bg-card); border-bottom: 1px solid var(--border-card); }
        .tab-btn { flex: 1; padding: 15px; background: none; border: none; color: var(--text-sec); font-size: 1rem; font-weight: 600; cursor: pointer; transition: 0.3s; }
        .tab-btn.active { color: var(--text-main); border-bottom: 3px solid var(--accent-light); background: rgba(123, 44, 191, 0.1); }
        
        main { padding: 20px; max-width: 600px; margin: 0 auto; }
        .section { display: none; animation: fadeIn 0.3s ease-in-out; }
        .section.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        /* ================= CARDS & FORMS ================= */
        .card { background: var(--bg-card); border: 1px solid var(--border-card); border-radius: 12px; padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        .card-header { font-size: 1.1rem; font-weight: bold; margin-bottom: 15px; color: var(--accent-light); }
        
        label { display: block; margin-bottom: 8px; color: var(--text-sec); font-size: 0.95rem; }
        select, input[type="file"] { width: 100%; padding: 12px; margin-bottom: 20px; background: var(--bg-main); border: 1px solid var(--border-card); color: var(--text-main); border-radius: 8px; font-size: 1rem; }
        select:focus { outline: none; border-color: var(--accent-light); }
        
        .btn { width: 100%; padding: 14px; background: var(--grad-btn); border: none; border-radius: 8px; color: #fff; font-weight: bold; font-size: 1rem; cursor: pointer; transition: 0.2s; }
        .btn:active { transform: scale(0.98); opacity: 0.9; }
        .btn-outline { background: transparent; border: 1px solid var(--accent-light); color: var(--accent-light); margin-top: 10px; }
        .btn-outline:active { background: rgba(157, 78, 221, 0.1); }

        /* ================= HISTORY & TABLES ================= */
        .summary-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        .summary-box { background: var(--bg-main); border: 1px solid var(--border-card); padding: 15px; border-radius: 8px; text-align: center; }
        .summary-box span { display: block; font-size: 0.8rem; color: var(--text-sec); }
        .summary-box strong { font-size: 1.2rem; color: var(--accent-light); }

        .table-container { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; min-width: 500px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid var(--border-card); font-size: 0.9rem; }
        th { color: var(--accent-light); font-weight: 600; background: rgba(36, 20, 66, 0.5); }
        td { color: var(--text-main); }
        .text-center { text-align: center; }
        
        /* Hidden UI utilities */
        .d-none { display: none !important; }
        #date-display { text-align: center; margin-bottom: 20px; font-size: 1.2rem; font-weight: bold; }
    </style>
</head>
<body>

    <header>
        <h1>Zhee Work Schedule</h1>
    </header>

    <div class="nav-tabs">
        <button class="tab-btn active" onclick="switchTab('presensi')">PRESENSI</button>
        <button class="tab-btn" onclick="switchTab('riwayat')">RIWAYAT</button>
    </div>

    <main>
        <!-- ================= HALAMAN PRESENSI ================= -->
        <section id="presensi" class="section active">
            <div id="date-display"></div>
            
            <div class="card" id="form-container">
                <!-- Form akan di-generate oleh JavaScript di sini -->
            </div>

            <div class="card d-none" id="done-container">
                <div class="card-header text-center">Presensi Hari Ini Selesai</div>
                <p class="text-center" style="color: var(--text-sec); margin-bottom: 15px;">Kamu sudah mengisi presensi untuk hari ini.</p>
                <button class="btn btn-outline" onclick="resetTodayForm()">Edit Presensi Hari Ini</button>
            </div>
        </section>

        <!-- ================= HALAMAN RIWAYAT ================= -->
        <section id="riwayat" class="section">
            <div class="card">
                <label for="filter-periode">Pilih Periode Bulan</label>
                <select id="filter-periode" onchange="renderHistory()"></select>
            </div>

            <div class="summary-grid">
                <div class="summary-box"><span>Hari Kerja</span><strong id="sum-hari">0</strong></div>
                <div class="summary-box"><span>Jam Reguler</span><strong id="sum-reguler">0</strong></div>
                <div class="summary-box"><span>Jam Lembur</span><strong id="sum-lembur">0</strong></div>
                <div class="summary-box"><span>Total Jam</span><strong id="sum-total">0</strong></div>
            </div>

            <div class="card">
                <div class="card-header">Detail Presensi</div>
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>Tgl</th>
                                <th>Hari</th>
                                <th>Status</th>
                                <th class="text-center">Reg</th>
                                <th class="text-center">Lembur</th>
                                <th class="text-center">Total</th>
                            </tr>
                        </thead>
                        <tbody id="history-body">
                            <!-- Data akan dimuat dari JS -->
                        </tbody>
                    </table>
                </div>
            </div>

            <div class="card">
                <div class="card-header">Backup & Restore</div>
                <button class="btn" onclick="exportData()" style="margin-bottom:15px;">Export Data (JSON)</button>
                <label style="margin-bottom:5px;">Import Data (JSON):</label>
                <input type="file" id="import-file" accept=".json">
                <button class="btn btn-outline" onclick="importData()">Restore Data</button>
            </div>
        </section>
    </main>

    <script>
        /* ================= CORE UTILITIES & PWA ================= */
        // Basic Service Worker untuk memenuhi kriteria PWA
        const swCode = `self.addEventListener('install', (e) => { e.waitUntil(self.skipWaiting()); }); self.addEventListener('activate', (e) => { e.waitUntil(self.clients.claim()); }); self.addEventListener('fetch', (e) => {});`;
        const swBlob = new Blob([swCode], {type: 'application/javascript'});
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register(URL.createObjectURL(swBlob)).catch(console.error);
        }

        const DB_KEY = 'zhee_schedule_data';
        const HARI_NAMES = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
        const BULAN_NAMES = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];

        function getDB() { return JSON.parse(localStorage.getItem(DB_KEY) || '[]'); }
        function saveDB(data) { localStorage.setItem(DB_KEY, JSON.stringify(data)); }

        // Navigasi Tab
        function switchTab(tabId) {
            document.querySelectorAll('.section').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            event.currentTarget.classList.add('active');
            if (tabId === 'riwayat') updateFilterDropdown();
        }

        /* ================= DATE & LOGIC ENGINE ================= */
        // Menentukan Periode berdasarkan tanggal tutup buku (Tgl 25)
        function getPeriode(dateObj) {
            let year = dateObj.getFullYear();
            let month = dateObj.getMonth() + 1;
            let date = dateObj.getDate();
            if (date > 25) { month += 1; if (month > 12) { month = 1; year += 1; } }
            return `${year}-${String(month).padStart(2, '0')}`;
        }

        function formatPeriodeName(periodeStr) {
            const [y, m] = periodeStr.split('-');
            return `${BULAN_NAMES[parseInt(m)-1]} ${y}`;
        }

        /* ================= PRESENSI MODULE ================= */
        function initPresensi() {
            const now = new Date();
            const todayStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
            const hariInt = now.getDay();
            
            document.getElementById('date-display').innerText = `${HARI_NAMES[hariInt]}, ${now.getDate()} ${BULAN_NAMES[now.getMonth()]} ${now.getFullYear()}`;

            const db = getDB();
            const alreadyFilled = db.find(d => d.id === todayStr);

            if (alreadyFilled) {
                document.getElementById('form-container').classList.add('d-none');
                document.getElementById('done-container').classList.remove('d-none');
            } else {
                renderFormContent(hariInt, todayStr);
            }
        }

        function resetTodayForm() {
            document.getElementById('done-container').classList.add('d-none');
            document.getElementById('form-container').classList.remove('d-none');
            const now = new Date();
            const todayStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
            renderFormContent(now.getDay(), todayStr);
        }

        function renderFormContent(hariInt, dateStr) {
            const container = document.getElementById('form-container');
            container.classList.remove('d-none');
            let html = `<div class="card-header">Input Kehadiran</div>`;

            if (hariInt >= 1 && hariInt <= 6) { 
                // Senin - Sabtu
                html += `
                    <label>Status Hari Ini</label>
                    <select id="input-status" onchange="toggleLemburReguler(${hariInt})">
                        <option value="Hadir">Masuk Kerja</option>
                        <option value="Tidak">Tidak Masuk</option>
                        <option value="Sakit">Sakit</option>
                        <option value="Izin">Izin</option>
                    </select>
                    <div id="lembur-wrapper">
                        <label>Lembur?</label>
                        <select id="input-lembur">
                            <option value="Tidak">Tidak</option>
                            <option value="Ya">Ya (Lembur)</option>
                        </select>
                    </div>`;
            } else if (hariInt === 0) { 
                // Minggu
                html += `
                    <label>Lembur Hari Ini? (Minggu)</label>
                    <select id="input-status-minggu" onchange="toggleLemburMinggu()">
                        <option value="Tidak">Tidak</option>
                        <option value="Ya">Ya, Saya Lembur</option>
                    </select>
                    <div id="opsi-lembur-minggu" class="d-none">
                        <label>Pilih Durasi Lembur</label>
                        <select id="input-durasi-minggu">
                            <option value="3">Opsi A: 13:00 - 16:00 (3 Jam)</option>
                            <option value="7">Opsi B: 13:00 - 20:00 (7 Jam)</option>
                        </select>
                    </div>`;
            }

            html += `<button class="btn" onclick="simpanPresensi(${hariInt}, '${dateStr}')" style="margin-top:20px;">Simpan Presensi</button>`;
            container.innerHTML = html;
        }

        function toggleLemburReguler(hariInt) {
            const status = document.getElementById('input-status').value;
            const lemburWrap = document.getElementById('lembur-wrapper');
            if (status === 'Hadir') { lemburWrap.classList.remove('d-none'); } 
            else { lemburWrap.classList.add('d-none'); document.getElementById('input-lembur').value = 'Tidak'; }
        }

        function toggleLemburMinggu() {
            const isLembur = document.getElementById('input-status-minggu').value;
            const opsiWrap = document.getElementById('opsi-lembur-minggu');
            if (isLembur === 'Ya') { opsiWrap.classList.remove('d-none'); } 
            else { opsiWrap.classList.add('d-none'); }
        }

        function simpanPresensi(hariInt, dateStr) {
            const nowObj = new Date();
            let jamReguler = 0; let jamLembur = 0; let isLembur = false; let statusLaporan = "";

            if (hariInt >= 1 && hariInt <= 6) {
                const status = document.getElementById('input-status').value;
                const lemburSelect = document.getElementById('input-lembur').value;
                statusLaporan = status;
                
                if (status === 'Hadir') {
                    jamReguler = (hariInt === 6) ? 5 : 8; // Sabtu 5 jam, Senin-Jumat 8 Jam
                    if (lemburSelect === 'Ya') {
                        isLembur = true;
                        jamLembur = (hariInt === 6) ? 2 : 3.5;
                    }
                }
            } else if (hariInt === 0) {
                const isLemburSelect = document.getElementById('input-status-minggu').value;
                if (isLemburSelect === 'Ya') {
                    statusLaporan = "Lembur";
                    isLembur = true;
                    jamLembur = parseFloat(document.getElementById('input-durasi-minggu').value);
                } else {
                    statusLaporan = "Libur";
                }
            }

            const payload = {
                id: dateStr,
                tanggal: dateStr,
                hari: HARI_NAMES[hariInt],
                status: statusLaporan,
                jamReguler: jamReguler,
                isLembur: isLembur,
                jamLembur: jamLembur,
                totalJam: jamReguler + jamLembur,
                periode: getPeriode(nowObj)
            };

            let db = getDB();
            db = db.filter(d => d.id !== dateStr); // Hapus jika sudah ada (Replace)
            db.push(payload);
            saveDB(db);
            
            initPresensi(); // Refresh UI
            if(document.getElementById('riwayat').classList.contains('active')) updateFilterDropdown();
        }

        /* ================= RIWAYAT MODULE ================= */
        function updateFilterDropdown() {
            const db = getDB();
            const select = document.getElementById('filter-periode');
            select.innerHTML = '';
            
            const periods = [...new Set(db.map(d => d.periode))].sort().reverse();
            if (periods.length === 0) {
                const currentPeriod = getPeriode(new Date());
                select.innerHTML = `<option value="${currentPeriod}">${formatPeriodeName(currentPeriod)}</option>`;
            } else {
                periods.forEach(p => {
                    select.innerHTML += `<option value="${p}">${formatPeriodeName(p)}</option>`;
                });
            }
            renderHistory();
        }

        function renderHistory() {
            const db = getDB();
            const activePeriod = document.getElementById('filter-periode').value;
            const tbody = document.getElementById('history-body');
            tbody.innerHTML = '';

            let filtered = db.filter(d => d.periode === activePeriod);
            // Sort ascending by date
            filtered.sort((a, b) => new Date(a.tanggal) - new Date(b.tanggal));

            let totalHadir = 0; let totalReg = 0; let totalLembur = 0; let totalAll = 0;

            if (filtered.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="text-center" style="color:var(--text-sec);">Belum ada data di periode ini.</td></tr>`;
            } else {
                filtered.forEach(d => {
                    if (d.status === 'Hadir' || d.status === 'Lembur') totalHadir++;
                    totalReg += d.jamReguler;
                    totalLembur += d.jamLembur;
                    totalAll += d.totalJam;

                    // Parse tanggal untuk tampilan ringkas (misal: 22 Okt)
                    const dateObj = new Date(d.tanggal);
                    const tglSort = `${String(dateObj.getDate()).padStart(2,'0')} ${BULAN_NAMES[dateObj.getMonth()].substring(0,3)}`;

                    tbody.innerHTML += `
                        <tr>
                            <td>${tglSort}</td>
                            <td>${d.hari}</td>
                            <td>${d.status}</td>
                            <td class="text-center">${d.jamReguler}</td>
                            <td class="text-center">${d.jamLembur}</td>
                            <td class="text-center" style="color:var(--accent-light); font-weight:bold;">${d.totalJam}</td>
                        </tr>
                    `;
                });
            }

            document.getElementById('sum-hari').innerText = totalHadir;
            document.getElementById('sum-reguler').innerText = totalReg;
            document.getElementById('sum-lembur').innerText = totalLembur;
            document.getElementById('sum-total').innerText = t
